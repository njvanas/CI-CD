name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      source:
        description: What triggered this deploy
        type: string
        required: false
        default: push

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp deploy metadata
        env:
          DEPLOY_SOURCE: ${{ inputs.source || github.event_name }}
          TRY_IT_PROXY_URL: ${{ vars.TRY_IT_PROXY_URL }}
        run: node scripts/stamp-deploy.mjs

      - name: Commit deploy metadata for branch-based Pages
        if: github.ref_name == 'master' || github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-runtime.js pages-deploy.json .nojekyll
          if git diff --staged --quiet; then
            echo "Deploy metadata unchanged."
          else
            git commit -m "chore: update deploy metadata [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
