name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - master
      - main
    paths:
      - "content/**"
      - "src/**"
      - "scripts/**"
      - "admin/**"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: deploy-pi
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & publish on Pi
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build static site
        run: npm run build

      - name: Publish to web root
        run: |
          set -euo pipefail
          WEB_ROOT="${WEB_ROOT:-/home/frikkie/docker/cicd/www}"
          mkdir -p "$WEB_ROOT"
          rsync -a --delete dist/ "$WEB_ROOT/"

      - name: Summary
        run: |
          echo "Site published to ${WEB_ROOT:-/home/frikkie/docker/cicd/www}"
          ls -la "${WEB_ROOT:-/home/frikkie/docker/cicd/www}" | head
