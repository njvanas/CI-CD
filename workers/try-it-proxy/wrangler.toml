name = "cicd-try-it-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Local wrangler uses simulated KV. Replace id with the real namespace
# from `npx wrangler kv namespace create RATE_LIMITS` before deploy.
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "local-rate-limits-preview"

[dev]
ip = "0.0.0.0"
port = 8787

[vars]
GITHUB_OWNER = "njvanas"
GITHUB_REPO = "CI-CD"
GITHUB_REF = "master"
GITHUB_WORKFLOW = "try-it.yml"
ALLOWED_ORIGINS = "https://njvanas.github.io,http://127.0.0.1:8765,http://localhost:8765"

# Secrets (never commit):
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put JWT_SECRET
#   wrangler secret put TRY_IT_PASSWORD_HASH
#
# Generate password hash:
#   node scripts/hash-try-it-password.mjs "your-long-demo-password"
