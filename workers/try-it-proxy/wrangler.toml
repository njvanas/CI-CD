name = "cicd-try-it-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"

# preview_id is used by `wrangler dev`. Production id is the RATE_LIMITS namespace.
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "f3d739150509428780e2f9145f4ae03b"
preview_id = "local-rate-limits-preview"

[dev]
ip = "0.0.0.0"
port = 8787

[vars]
GITHUB_OWNER = "njvanas"
GITHUB_REPO = "CI-CD"
GITHUB_REF = "master"
GITHUB_WORKFLOW = "try-it.yml"
ALLOWED_ORIGINS = "https://njvanas.github.io,http://127.0.0.1:8765,http://localhost:8765"

# Secrets (never commit):
#   wrangler secret put GITHUB_TOKEN
