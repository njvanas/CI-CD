services:
  cicd:
    build:
      context: ../..
      dockerfile: services/cicd-api/Dockerfile
    container_name: cicd
    restart: unless-stopped
    environment:
      PORT: "3000"
      REPO_PATH: /repo
      WWW_PATH: /www
      GITHUB_OWNER: njvanas
      GITHUB_REPO: CI-CD
      GITHUB_BRANCH: master
      GIT_USER_NAME: CI/CD Demo
      GIT_USER_EMAIL: cicd-demo@dolfieshome.org
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - /home/frikkie/docker/cicd/repo:/repo
      - /home/frikkie/docker/cicd/www:/www
      - /home/frikkie/.ssh/cicd_deploy:/root/.ssh/id_ed25519:ro
      - /home/frikkie/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cicd.rule=Host(`cicd.dolfieshome.org`)"
      - "traefik.http.routers.cicd.entrypoints=web"
      - "traefik.http.services.cicd.loadbalancer.server.port=3000"
      - "traefik.http.routers.cicd.middlewares=cicd-headers"
      - "traefik.http.middlewares.cicd-headers.headers.customrequestheaders.X-Forwarded-Proto=https"

networks:
  proxy:
    external: true
